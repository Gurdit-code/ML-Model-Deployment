services:

  api:
    build: .
    container_name: ml-model-api
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build: .
    container_name: ml-model-frontend
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    depends_on:
      - api